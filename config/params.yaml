# Central config for the VRP iron condor project.
# Cross-reference: docs/project_spec.md sections 3, 5, and 9.
# Anything marked TODO must be decided together before Phase 2 work
# gets built out against it.

signal:
  iv_rank_lookback_days: 252
  iv_rank_thresholds_to_test: [50, 70, 80]  # sweep, don't hand-pick after seeing results

structure:
  underlying: SPX
  short_delta: 0.20
  long_delta: 0.05
  cycle: monthly

exit:
  version: v1_hold_to_expiration   # switch to "v2_close_at_50pct_max_profit" once v1 is validated

risk:
  max_risk_per_trade_pct: 0.02
  portfolio_heat_cap_pct: 0.06       # ~3x per-trade cap; confirmed together 2026-08-03.
                                      # v1 backtest engine only ever holds 1 position at a time,
                                      # so this doesn't bind yet -- forward-looking for Phase 5+
                                      # (paper trading, or overlapping cycles/thresholds later).
  starting_capital_usd: 1000         # placeholder, confirm together
  kelly_fraction: 0.5                # half-Kelly; never 1.0

# Phase 3 proxy backtest: we don't have real historical SPX options chain
# data yet (docs/project_spec.md section 6), so trade legs are priced with
# Black-Scholes off VIX as a flat implied vol. Confirmed together 2026-08-02;
# revisit once a real chain data provider is chosen. See src/backtest/pricing.py
# for the caveats this introduces (no skew, no dividend yield).
pricing_proxy:
  method: black_scholes_flat_vix
  risk_free_rate_source: yfinance_IRX   # 13-week T-bill (^IRX), pulled historically
  dte_trading_days: 21                  # approximates the monthly cycle; not actual 3rd-Friday expirations
  contract_multiplier: 100              # standard SPX option multiplier

backtest:
  split_regimes: true                # report pre-2010 and post-2010 separately
  regime_split_year: 2010
  model_transaction_costs: true
  model_bid_ask_slippage: true
  cost_per_contract_usd: 0.65        # exchange/regulatory fees; Alpaca itself is commission-free
  slippage_pct_of_credit: 0.10       # haircut on net credit to proxy 4-leg bid-ask slippage

# Reframed from a statistical test to an operational one, 2026-08-03.
# Why: at the measured post-2010 trade frequency (3.22/yr at threshold >50,
# 1.61/yr at >70, 1.21/yr at >80), a "beat SPY and CNDR on Sharpe" gate could
# never be honestly satisfied -- ~100 trades are needed before a 95% CI on the
# Sharpe excludes zero, which is ~62 years at the >70 rate. Keeping an
# unreachable gate invites rationalizing past it, which is the exact failure
# pre-registration exists to prevent. Full derivation in project_spec.md s9.
paper_trading:
  min_expiration_cycles: 6
  min_trades: 5
  # Paper trade the LOOSEST threshold only. The thresholds are nested (every
  # >80 trade is also a >70 and a >50), so tagging each trade with its entry
  # IV rank lets one stream evaluate all three variants -- 3x the data rate
  # of running three separate books, at no cost.
  paper_stream_threshold: 50

  # Go-live gate is operational, not statistical: does the execution path work?
  go_live_requires: operational_validation
  # ANY of these kills the live phase regardless of P&L.
  disqualifying_conditions:
    median_slippage_pct_of_credit_above: 0.20   # 2x the modeled 0.10 assumption
    signal_diverged_from_backtest: true         # live signal must fire when the backtest says it would
    settlement_reconciliation_failed: true      # realized P&L must match model given actual settlement

  # Benchmarks are still REPORTED for context in the write-up -- they are just
  # no longer a pass/fail gate, since the sample can't support the comparison.
  report_benchmarks: [SPY, CNDR]
  report_metrics: [sharpe, sortino]

benchmarks:
  - SPY
  - CNDR
