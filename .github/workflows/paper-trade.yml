name: paper-trade

# 19:30 UTC on weekdays. That is 15:30 ET in summer and 14:30 ET in winter --
# GitHub cron has no DST handling, so this single UTC time was chosen because
# BOTH land inside market hours (09:30-16:00 ET) with room to work an order.
# Holidays and early closes are handled at runtime via Alpaca's clock, not here.
#
# Why near the close: the backtest computes the signal from daily CLOSE data,
# so trading late in the session is the closest live approximation. It is not
# exact -- a real, disclosed backtest/live divergence.
on:
  schedule:
    # Slots are EARLY on purpose. GitHub's shared scheduler is best-effort:
    # on 2026-08-05 these fired 57-73 minutes late (19:30 -> 20:43 UTC),
    # which is 4:43 PM ET, AFTER the 4:00 close. Every run that day would
    # have hit the market-closed guard. At ~3 trades/year, missing one is
    # a third of the annual sample.
    #
    # 17:30 / 18:15 / 19:00 UTC = 1:30 / 2:15 / 3:00 PM ET in summer.
    # The first two survive a 90-minute delay and still land inside market
    # hours; in winter all three do.
    #
    # TRADE-OFF, stated because it is a real divergence: the backtest
    # computes its signal from daily CLOSES, so deciding at ~1:30 PM is
    # further from that than the old 3:30 PM slot. VIX moves intraday --
    # on 2026-08-05 it ranged 15.84 to 18.43, about 15 IV-rank points. That
    # divergence is accepted deliberately: entering a couple of hours early
    # is a bounded, disclosed inaccuracy, whereas missing the day entirely
    # loses a third of the year's data. Every trade logs its actual entry
    # time so the effect can be measured rather than assumed.
    - cron: "30 17 * * 1-5"
    - cron: "15 18 * * 1-5"
    - cron: "0 19 * * 1-5"

  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab
    inputs:
      dry_run:
        description: "Decide and log, but submit nothing"
        type: boolean
        default: true

permissions:
  contents: write             # needed to commit the trade log back

concurrency:
  group: paper-trade          # never let two runs trade at once
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # a 5-step ladder is ~5 min; this is generous headroom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests before trading
        # A broken build must never place an order. This is cheap (~1s) and is
        # the last line of defence between a bad commit and a live submission.
        run: python -m pytest tests/ -q

      - name: Decide and trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "manual dry run -- nothing will be submitted"
            python -m src.execution.runner
          else
            python -m src.execution.runner --submit
          fi

      - name: Commit the trade log
        # The log is the dataset the write-up depends on (spec s5). A cloud
        # runner is ephemeral, so it has to be persisted back to the repo or
        # every signal check is lost. [skip ci] stops this commit re-triggering.
        #
        # Retries because two runs appending different lines to the same log
        # will race. .gitattributes marks logs/*.jsonl as merge=union so the
        # merge keeps BOTH records rather than conflicting -- correct for an
        # append-only log -- but the push itself can still lose a race, so it
        # is attempted a few times before giving up.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain logs/)" ]; then
            echo "no log changes"; exit 0
          fi
          git add logs/
          git commit -m "trade log: $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --no-rebase --no-edit origin main && git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push race on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::could not push the trade log after 5 attempts"
          exit 1
